<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Carter &amp; Alysson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
/* Matches the Puzzle Duel scoreboard: same tokens, fonts, card and tiles. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#121213; --muted:#5d6067; --line:#d3d6da; --soft:#e7e8eb;
  --p1:#b0c4ef; --p1-ink:#2b4a8e; --p2:#f9df6d; --p2-ink:#735800; --good:#3f7a3a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121213;--surface:#1c1c1e;--ink:#f1f1ef;--muted:#a3a5ab;--line:#3a3a3c;--soft:#29292c;--p1-ink:#bccff4;--p2-ink:#f6dc6a;--good:#86c77f;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) max(48px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:32px}
h1,h2{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h1 .vs{color:var(--muted);font-weight:500}
h2{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.muted{color:var(--muted)}
.top{display:flex;flex-direction:column;gap:14px}
.day{font-family:var(--display);font-weight:600;font-size:24px;text-align:center;letter-spacing:.01em;height:43px;display:flex;align-items:center;justify-content:center;margin-top:6px}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:15px 16px 11px}
.side .name{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.side.right{text-align:right}.side.right .name{justify-content:flex-end}
.sq{width:12px;height:12px;border-radius:2px;display:inline-block}
.big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;margin-top:6px}
.pill{margin-top:20px;border:1.5px solid var(--good);color:var(--good);border-radius:999px;padding:0 9px;height:24px;display:flex;align-items:center;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.status{border-top:1.5px solid var(--soft);padding:16px;font-size:16px;line-height:1.4}
.status b{font-weight:700}
.status span{color:var(--muted)}
.rows{border-top:1.5px solid var(--soft);padding:12px 16px 14px}
.row{padding:4.5px 0}
.rhead{display:grid;grid-template-columns:1fr 78px;gap:12px;align-items:center}
.rname{font-weight:600;font-size:16px;line-height:1.2}
.rsub{color:var(--muted);font-size:13px;line-height:1.25;margin-top:1px}
.tile{height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;border:2px dashed var(--line);color:var(--muted);background:transparent;width:100%}
.tile.play{border:2px solid var(--line);color:var(--ink);background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tile.done{border:2px solid var(--p2);background:var(--p2);color:#121213}
form.code{display:flex;gap:8px;margin:8px 0 6px}
form.code input{flex:1;min-width:0;height:40px;border:2px solid var(--line);border-radius:6px;padding:0 12px;font:600 15px var(--body);letter-spacing:.18em;text-transform:uppercase;background:var(--bg);color:var(--ink)}
form.code input:focus{outline:3px solid var(--p1-ink);outline-offset:1px}
form.code.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:0 12px;height:40px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.msg{margin-top:8px;background:var(--soft);border-radius:6px;padding:9px 12px;font-size:14px;line-height:1.4}
.acts{display:flex;gap:8px;margin:8px 0 6px;flex-wrap:wrap}
.acts .btn{flex:1;height:36px}
.final{display:flex;flex-direction:column;gap:8px}
.final p{font-size:17px;line-height:1.5}
.hidden{display:none!important}
.player{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:10}
.player.show{display:flex}
.player .bar{height:calc(46px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);flex:0 0 auto;display:flex;align-items:center;padding-left:12px;padding-right:12px;background:var(--bg);border-bottom:2px solid var(--line)}
.player .bar .btn{height:34px;font-size:14px}
.player iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Carter <span class="vs">♥</span> Alysson</h1>
    <div class="day" id="day"></div>
  </div>
  <div class="card">
    <div class="score">
      <div class="side"><div class="name"><i class="sq" style="background:var(--p2)"></i>Solved</div><div class="big" id="nSolved">0</div></div>
      <div class="pill" id="pill">Live</div>
      <div class="side right"><div class="name">To go<i class="sq" style="background:var(--p1)"></i></div><div class="big" id="nLeft">4</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="final hidden" id="final"><h2 id="finalTitle"></h2><p id="finalMsg"></p></div>
</div>
<div class="player" id="player">
  <div class="bar"><button class="btn" id="backBtn">‹ All stops</button></div>
  <iframe id="frame" title="Puzzle"></iframe>
</div>
<script>
/* ======= EDIT THESE ======= */
const CONFIG = {
  intro: "You want that safe key, don't you?",
  howTo: "Each clue has a code. Enter it to unlock your next puzzle.",
  stops: [
    { id: "connections", code: "SPARK", name: "Connections", sub: "Create four groups of four!", game: "games/connections.html",
      locked: "Enter the code from the first thing you were handed.",
      solvedMsg: "Maybe this ID card is more of a key than a clue..." },
    { id: "wordle", code: "PICCOLO", name: "Wordle", sub: "Oh no, this one has six letters...", game: "games/wordle.html",
      locked: "Enter the code from what you found at the lab.",
      solvedMsg: "Thirsty? Catch a ride! Leave the LSB and look for a familiar face by the duck pond..." },
    { id: "strands", code: "FIZZ", name: "Strands", sub: "Find the theme words!", game: "games/strands.html",
      locked: "Enter the code from what you got with your drink.",
      solvedMsg: "The irony - you probably actually hope someone's at the apartment this time..." },
    { id: "wordsearch", code: "COZY", name: "One Word Search", sub: "Might be tough to beat a minte on this one...", game: "games/wordsearch.html",
      locked: "Enter the code from what you picked up at my place.",
      solvedMsg: "Remember when we laid under a tree all night and fell in love?",
      directions: { lat: 40.294619, lng: -111.663715, label: "Riverview Park" } }
  ],
  finalTitle: "Almost there…",
  finalMessage: "Find what's waiting at our tree. Then keep an eye on my location. 💛"
};
/* ========================== */
const store = {
  get() { try { return JSON.parse(localStorage.getItem("hunt-progress") || "{}"); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem("hunt-progress", JSON.stringify(v)); } catch (e) {} }
};
let progress = Object.assign({ unlocked: [], solved: [] }, store.get());
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
$("#day").textContent = "Today · " + new Date().toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });

function render() {
  const total = CONFIG.stops.length, solvedN = CONFIG.stops.filter(s => progress.solved.includes(s.id)).length;
  $("#nSolved").textContent = solvedN; $("#nLeft").textContent = total - solvedN;
  $("#pill").textContent = solvedN === total ? "Done" : "Live";
  const st = $("#status"); st.innerHTML = "";
  if (solvedN === 0) { st.append(el("b", null, CONFIG.intro + " ")); st.append(el("span", null, CONFIG.howTo)); }
  else if (solvedN < total) { st.append(el("b", null, `${solvedN} down, ${total - solvedN} to go. `)); st.append(el("span", null, "Head to your next stop for its code.")); }
  else { st.append(el("b", null, "All four solved. ")); st.append(el("span", null, "One last thing is waiting for you.")); }

  const rows = $("#rows"); rows.innerHTML = "";
  CONFIG.stops.forEach((s, i) => {
    const unlocked = progress.unlocked.includes(s.id), solved = progress.solved.includes(s.id);
    const reachable = i === 0 || progress.solved.includes(CONFIG.stops[i - 1].id);
    const row = el("div", "row"), head = el("div", "rhead"), left = el("div");
    left.append(el("div", "rname", unlocked ? s.name : `Stop ${i + 1}`));
    left.append(el("div", "rsub", solved ? "solved" : unlocked ? s.sub : reachable ? s.locked : "locked"));
    const tile = el("button", "tile", solved ? "✓" : unlocked ? "Play" : "—");
    if (unlocked && !solved) tile.classList.add("play");
    if (solved) tile.classList.add("done");
    if (unlocked) tile.onclick = () => open(s); else tile.disabled = true;
    head.append(left, tile); row.append(head);

    if (!unlocked && reachable) {
      const f = el("form", "code");
      const input = el("input"); input.placeholder = "Code"; input.autocomplete = "off"; input.spellcheck = false; input.setAttribute("autocapitalize", "characters");
      const b = el("button", "btn", "Unlock");
      f.append(input, b);
      f.addEventListener("submit", e => {
        e.preventDefault();
        if (input.value.trim().toUpperCase() === s.code.toUpperCase()) { progress.unlocked.push(s.id); store.set(progress); render(); open(s); }
        else { f.classList.remove("bad"); void f.offsetWidth; f.classList.add("bad"); input.select(); }
      });
      row.append(f);
    }
    if (solved) {
      row.append(el("div", "msg", s.solvedMsg));
      const acts = el("div", "acts");
      const again = el("button", "btn", "Play again"); again.onclick = () => open(s); acts.append(again);
      if (s.directions) {
        const d = s.directions, dir = el("button", "btn", "Need directions?");
        dir.onclick = () => {
          dir.remove();
          [["Apple Maps", `https://maps.apple.com/?daddr=${d.lat},${d.lng}&q=${encodeURIComponent(d.label)}`],
           ["Google Maps", `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}`]].forEach(([t, href]) => {
            const a = el("a", "btn", t); a.href = href; a.target = "_blank"; a.rel = "noopener"; acts.append(a);
          });
        };
        acts.append(dir);
      }
      row.append(acts);
    }
    rows.append(row);
  });
  const done = solvedN === total;
  $("#final").classList.toggle("hidden", !done);
  $("#finalTitle").textContent = CONFIG.finalTitle; $("#finalMsg").textContent = CONFIG.finalMessage;
}
// Tell the Puzzle Duel page to hide its tab bar while a game is open, so the game gets the whole screen.
const tellParent = on => { try { if (parent !== window) parent.postMessage({ type: "hunt-playing", on }, "*"); } catch (e) {} };
function open(s) { $("#frame").src = s.game; $("#player").classList.add("show"); tellParent(true); }
$("#backBtn").onclick = () => { $("#player").classList.remove("show"); $("#frame").src = "about:blank"; tellParent(false); render(); };
window.addEventListener("message", e => {
  if (e.data && e.data.type === "hunt-solved" && !progress.solved.includes(e.data.game)) {
    progress.solved.push(e.data.game); store.set(progress); render();
  }
});
render();
</script>
</body>
</html>
