<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Little Word Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #3994b5; --card: #fff; --circle: #efefef; --ink: #111;
    --good: #3fb489; --bad: #e35f43; --sel: #2c7896;
    --soft: rgba(255,255,255,.55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    color: #fff; font-family: 'Montserrat', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  }
  .top {
    width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px 0;
  }
  .sq {
    width: 47px; height: 47px; border-radius: 10px; background: rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center; border: none; padding: 0; cursor: pointer;
    color: #fff; font-family: 'Montserrat', system-ui, sans-serif; font-weight: 800; font-size: 26px;
  }
  .sq .bars { display: flex; flex-direction: column; gap: 4px; }
  .sq .bars i { display: block; width: 24px; height: 5px; border-radius: 3px; background: #fff; }
  .brand { text-align: center; }
  .brand .name { font-size: 18px; letter-spacing: 3px; font-weight: 400; }
  .brand .name b { font-weight: 800; }
  .brand .sub { font-family: 'Lato', system-ui, sans-serif; font-size: 11px; letter-spacing: 3.2px; color: var(--soft); margin-top: 5px; }
  .feedback { height: 106px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px; margin-top: 18px; }
  .feedback .w { font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #e9f4f7; padding-left: 6px; }
  .feedback .m { font-family: 'Lato', system-ui, sans-serif; font-size: 15px; color: rgba(233,244,247,.6); margin-top: 6px; }
  .card {
    --size: min(90vw, 360px);
    width: var(--size); height: var(--size); flex: 0 0 auto; background: var(--card); border-radius: 22px;
    padding: 13px; box-shadow: 0 8px 18px rgba(0,0,0,.18);
  }
  .board { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
  .tile {
    position: absolute; width: 20%; height: 20%; padding: 5px; display: flex;
    transition: top .42s cubic-bezier(.3,1.2,.5,1), opacity .25s, transform .25s;
  }
  .tile .face {
    width: 100%; aspect-ratio: 1 / 1; max-height: 100%; margin: auto; border-radius: 50%; background: var(--circle); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: clamp(20px, 7.4vw, 27px);
    transition: background .12s, color .12s;
  }
  .tile.sel .face { background: var(--sel); color: #fff; }
  .tile.found .face { background: var(--good); color: #fff; }
  .tile.wrong .face { background: var(--bad); color: #fff; }
  .tile.gone { opacity: 0; transform: scale(.3); }
  .tile.hint .face { animation: pulse 1.1s ease-in-out 3; }
  @keyframes pulse { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 0 4px #f2c14e; } }
  .remaining { margin-top: 36px; font-size: 16px; letter-spacing: 3.5px; color: var(--soft); font-weight: 500; }
  .remaining b { color: rgba(255,255,255,.85); font-weight: 700; margin-right: 10px; letter-spacing: 1px; }
  .clock { font-family: 'Lato', system-ui, sans-serif; font-size: 15px; color: var(--soft); margin-top: 18px; text-align: center; padding: 0 20px; min-height: 20px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(15,40,52,.55);
    display: none; align-items: center; justify-content: center; padding: 22px;
  }
  .overlay.show { display: flex; animation: fade .4s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .fcard {
    background: #fff; color: var(--ink); border-radius: 22px; padding: 28px 22px; text-align: center;
    max-width: 360px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: pop .45s;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .fcard h2 { margin: 0; color: var(--bg); font-weight: 800; font-size: 24px; letter-spacing: 1px; }
  .fcard .time { font-family: 'Lato', system-ui, sans-serif; color: #777; font-size: 14px; margin-top: 4px; }
  .fcard .words { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 16px 0 6px; }
  .fcard .chip { background: var(--good); color: #fff; border-radius: 999px; padding: 4px 11px; font-weight: 700; font-size: 13px; letter-spacing: 2px; }
  .fcard p { font-family: 'Lato', system-ui, sans-serif; font-size: 18px; line-height: 1.45; margin: 12px 0 0; font-weight: 700; }
  .fcard .small { font-size: 14px; color: #777; font-weight: 400; margin-top: 8px; }
  .dirBtn {
    margin-top: 18px; border: 2px solid var(--bg); background: #fff; color: var(--bg);
    font-family: 'Montserrat', system-ui, sans-serif; font-weight: 700; font-size: 15px;
    border-radius: 999px; padding: 10px 20px; cursor: pointer;
  }
  .dirLinks { display: none; margin-top: 14px; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .dirLinks.show { display: flex; }
  .dirLinks a {
    background: var(--bg); color: #fff; text-decoration: none; border-radius: 999px;
    padding: 10px 18px; font-family: 'Montserrat', system-ui, sans-serif; font-weight: 700; font-size: 14px;
  }
</style>
</head>
<body>
<div class="top">
  <button class="sq" aria-hidden="true" tabindex="-1"><span class="bars"><i></i><i></i><i></i></span></button>
  <div class="brand">
    <div class="name">LITTLE<b>WORD</b>HUNT</div>
    <div class="sub" id="sub">JUST FOR YOU</div>
  </div>
  <button class="sq" id="hintBtn" title="Hint">?</button>
</div>
<div class="feedback"><div class="w" id="fbWord"></div><div class="m" id="fbMsg"></div></div>
<div class="card"><div class="board" id="board"></div></div>
<div class="remaining" id="remaining"></div>
<div class="clock" id="clock">The clock will begin when you find the first word.</div>
<div class="overlay" id="overlay">
  <div class="fcard">
    <h2 id="finaleTitle"></h2>
    <div class="time" id="finaleTime"></div>
    <div class="words" id="finaleWords"></div>
    <p id="finaleMsg"></p>
    <p class="small" id="finaleSmall"></p>
    <button class="dirBtn" id="dirBtn">Need directions?</button>
    <div class="dirLinks" id="dirLinks">
      <a id="appleLink" target="_blank" rel="noopener">Apple Maps</a>
      <a id="googleLink" target="_blank" rel="noopener">Google Maps</a>
    </div>
  </div>
</div>

<script>
/* ======= EDIT THESE ======= */
const CONFIG = {
  title: "Little Word Hunt",
  // Each word must be exactly 5 letters. Found in this order.
  words: ["VISIT", "SWING", "GRASS", "TREES", "NIGHT", "STARS", "CLOSE", "TIRED", "EARLY", "CARRY"],
  finaleTitle: "You found them all!",
  finaleMessage: "Remember when we laid under a tree all night and fell in love?",
  finaleSmall: "Your next clue is waiting there.",
  // Backup directions, hidden behind a "Need directions?" button on the final screen.
  // Drop a pin on the exact spot (e.g., the tree) and paste its coordinates here.
  directions: { label: "Riverview Park", lat: 40.294619, lng: -111.663715 }
};
/* ========================== */

const N = 5;
const LINES = (() => {
  const L = [];
  for (let r = 0; r < N; r++) L.push([...Array(N)].map((_, c) => [r, c]));
  for (let c = 0; c < N; c++) L.push([...Array(N)].map((_, r) => [r, c]));
  L.push([...Array(N)].map((_, i) => [i, i]));
  L.push([...Array(N)].map((_, i) => [i, N - 1 - i]));
  const all = [];
  for (const l of L) { all.push(l); all.push([...l].reverse()); }
  return all;
})();

let nextId = 1;
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const COMMON = "EEEEAAAIIIOOOUTTNNRRSSLLDDHCMPGBKWYF";

function fillerLetter(word) {
  // Half the filler comes from the target word to make convincing decoys.
  return Math.random() < 0.5 ? word[rnd(word.length)] : COMMON[rnd(COMMON.length)];
}

function countWord(grid, word) {
  let n = 0;
  for (const line of LINES) {
    let s = "";
    for (const [r, c] of line) s += grid[r][c] ? grid[r][c].ch : "_";
    if (s === word) n++;
  }
  return n;
}

function findWord(grid, word) {
  for (const line of LINES) {
    let s = "";
    for (const [r, c] of line) s += grid[r][c] ? grid[r][c].ch : "_";
    if (s === word) return line;
  }
  return null;
}

// Plan the whole game up front: every tile (including ones that will drop in later)
// starts blank; each round picks a random line whose tiles are blank or already match,
// so words can show up anywhere, built from old letters that fell plus new ones.
function planGame(words) {
  for (let tries = 0; tries < 500; tries++) {
    const tiles = [];
    const mk = round => { const t = { id: nextId++, ch: null, round }; tiles.push(t); return t; };
    let grid = [...Array(N)].map(() => [...Array(N)].map(() => mk(0)));
    const snaps = [], lines = [];
    let ok = true, prevKey = null;
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      const opts = shuffle(LINES.slice()).filter(line =>
        line.every(([r, c], k) => grid[r][c].ch === null || grid[r][c].ch === w[k]) &&
        // after round 1, each word must use at least one newly dropped tile,
        // so it can't already be sitting on the board in an earlier round
        (i === 0 || line.some(([r, c]) => grid[r][c].round === i)));
      // avoid repeating the exact same spot as the last word
      const pick = opts.find(l => lineKey(l) !== prevKey) || opts[0];
      if (!pick) { ok = false; break; }
      pick.forEach(([r, c], k) => { grid[r][c].ch = w[k]; });
      snaps.push(grid); lines.push(pick); prevKey = lineKey(pick);
      grid = applyGravity(grid, pick);
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) grid[r][c] = mk(i + 1);
    }
    if (!ok) continue;
    const blanks = tiles.filter(t => t.ch === null);
    for (let f = 0; f < 200; f++) {
      for (const t of blanks) t.ch = fillerLetter(words[Math.min(t.round, words.length - 1)]);
      // each round shows its own word exactly once and no other word from the list
      if (snaps.every((g, i) => words.every((w, j) => countWord(g, w) === (j === i ? 1 : 0)))) return snaps;
    }
    for (const t of blanks) t.ch = null;
  }
  throw new Error("Could not build puzzle");
}

function lineKey(line) {
  return line.map(([r, c]) => r * N + c).sort((a, b) => a - b).join(",");
}

function applyGravity(grid, removed) {
  const g = grid.map(row => row.slice());
  for (const [r, c] of removed) g[r][c] = null;
  for (let c = 0; c < N; c++) {
    const col = [];
    for (let r = N - 1; r >= 0; r--) if (g[r][c]) col.push(g[r][c]);
    for (let r = N - 1, k = 0; r >= 0; r--, k++) g[r][c] = col[k] || null;
  }
  return g;
}

if (typeof document !== "undefined") {
  const words = CONFIG.words.map(w => w.toUpperCase());
  let level = 0;
  const snaps = planGame(words);
  let grid = snaps[0];
  let busy = false;
  const tileEls = new Map();
  const board = document.getElementById("board");
  const fbWord = document.getElementById("fbWord"), fbMsg = document.getElementById("fbMsg");
  const clockEl = document.getElementById("clock");
  let t0 = null, timer = null;
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  function renderRemaining() {
    const left = words.length - level;
    document.getElementById("remaining").innerHTML =
      left > 0 ? `<b>${left}</b>WORD${left === 1 ? "" : "S"} REMAINING` : "ALL WORDS FOUND";
  }

  function render() {
    const seen = new Set();
    const initial = tileEls.size === 0;
    for (let c = 0; c < N; c++) {
      let freshCount = 0;
      for (let r = 0; r < N; r++) if (grid[r][c].round === level && !initial) freshCount++;
      for (let r = 0; r < N; r++) {
        const t = grid[r][c];
        seen.add(t.id);
        let el = tileEls.get(t.id);
        if (!el) {
          el = document.createElement("div");
          el.className = "tile";
          el.innerHTML = `<div class="face">${t.ch}</div>`;
          el.style.left = c * 20 + "%";
          el.style.top = (initial ? r * 20 : (r - freshCount) * 20) + "%";
          board.appendChild(el);
          tileEls.set(t.id, el);
        }
        el.dataset.r = r; el.dataset.c = c;
        el.style.left = c * 20 + "%";
        requestAnimationFrame(() => requestAnimationFrame(() => { el.style.top = r * 20 + "%"; }));
      }
    }
    for (const [id, el] of tileEls) if (!seen.has(id)) { el.remove(); tileEls.delete(id); }
    renderRemaining();
  }

  function clearMarks() {
    for (const el of tileEls.values()) el.classList.remove("sel", "wrong");
  }
  function mark(cells, cls) {
    clearMarks();
    for (const [r, c] of cells) tileEls.get(grid[r][c].id).classList.add(cls);
  }

  // ---- swipe / flick ----
  let start = null, sel = [], swipeDir = null, wrongTimer = null;
  const rel = (x, y) => { const b = board.getBoundingClientRect(); return { fx: (x - b.left) / b.width * N, fy: (y - b.top) / b.height * N, cw: b.width / N }; };

  board.addEventListener("pointerdown", e => {
    if (busy || level >= words.length) return;
    const { fx, fy } = rel(e.clientX, e.clientY);
    const r = Math.floor(fy), c = Math.floor(fx);
    if (r < 0 || r >= N || c < 0 || c >= N) return;
    board.setPointerCapture(e.pointerId);
    clearTimeout(wrongTimer);
    start = { r, c, x: e.clientX, y: e.clientY };
    swipeDir = null;
    sel = [[r, c]]; mark(sel, "sel");
  });
  board.addEventListener("pointermove", e => {
    if (!start) return;
    const { fx, fy, cw } = rel(e.clientX, e.clientY);
    const moved = Math.hypot(e.clientX - start.x, e.clientY - start.y) / cw;
    if (moved >= 0.25) {
      const a = Math.round(Math.atan2(e.clientY - start.y, e.clientX - start.x) / (Math.PI / 4));
      swipeDir = [Math.round(Math.sin(a * Math.PI / 4)), Math.round(Math.cos(a * Math.PI / 4))];
    }
    const dx = fx - (start.c + .5), dy = fy - (start.r + .5), dist = Math.hypot(dx, dy);
    if (dist < 0.45) { sel = [[start.r, start.c]]; mark(sel, "sel"); return; }
    const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
    const sc = Math.round(Math.cos(a * Math.PI / 4)), sr = Math.round(Math.sin(a * Math.PI / 4));
    const steps = Math.round(dist / ((sc && sr) ? Math.SQRT2 : 1));
    const cells = [[start.r, start.c]];
    for (let i = 1; i <= steps; i++) {
      const r = start.r + sr * i, c = start.c + sc * i;
      if (r < 0 || r >= N || c < 0 || c >= N) break;
      cells.push([r, c]);
    }
    sel = cells; mark(sel, "sel");
  });

  const endSwipe = () => {
    if (!start) return;
    start = null;
    let cells = sel;
    // A flick or partial swipe counts: extend it to a full 5-letter line.
    if (cells.length < N && swipeDir) {
      const [r0, c0] = cells[0], [sr, sc] = swipeDir;
      const full = [...Array(N)].map((_, i) => [r0 + sr * i, c0 + sc * i]);
      if (full.every(([r, c]) => r >= 0 && r < N && c >= 0 && c < N)) cells = full;
    }
    if (cells.length !== N) { clearMarks(); return; }
    const s = cells.map(([r, c]) => grid[r][c].ch).join("");
    const w = words[level];
    if (s === w || [...s].reverse().join("") === w) found(cells, w);
    else {
      fbWord.textContent = s; fbMsg.textContent = "No, not quite right";
      mark(cells, "wrong");
      wrongTimer = setTimeout(clearMarks, 900);
    }
  };
  board.addEventListener("pointerup", endSwipe);
  board.addEventListener("pointercancel", endSwipe);

  function found(cells, word) {
    busy = true;
    if (!t0) {
      t0 = Date.now();
      const tick = () => { clockEl.textContent = fmt(Math.floor((Date.now() - t0) / 1000)); };
      tick(); timer = setInterval(tick, 1000);
    }
    fbWord.textContent = word; fbMsg.textContent = "Yes, that's right.";
    clearMarks();
    for (const [r, c] of cells) {
      const el = tileEls.get(grid[r][c].id);
      el.classList.remove("hint"); el.classList.add("found");
    }
    if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
    setTimeout(() => {
      for (const [r, c] of cells) tileEls.get(grid[r][c].id).classList.add("gone");
      setTimeout(() => {
        level++;
        if (level >= words.length) { renderRemaining(); finale(); return; }
        grid = snaps[level];
        render();
        busy = false;
      }, 260);
    }, 650);
  }

  function finale() {
    clearInterval(timer);
    const secs = Math.floor((Date.now() - t0) / 1000);
    clockEl.textContent = fmt(secs);
    document.getElementById("finaleTitle").textContent = CONFIG.finaleTitle;
    document.getElementById("finaleTime").textContent = `Finished in ${fmt(secs)}`;
    document.getElementById("finaleMsg").textContent = CONFIG.finaleMessage;
    document.getElementById("finaleSmall").textContent = CONFIG.finaleSmall;
    const fw = document.getElementById("finaleWords");
    words.forEach(w => { const d = document.createElement("span"); d.className = "chip"; d.textContent = w; fw.appendChild(d); });
    const d = CONFIG.directions;
    if (d) {
      const q = encodeURIComponent(d.label);
      document.getElementById("appleLink").href = `https://maps.apple.com/?daddr=${d.lat},${d.lng}&q=${q}`;
      document.getElementById("googleLink").href = `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}`;
      document.getElementById("dirBtn").onclick = () => {
        document.getElementById("dirBtn").style.display = "none";
        document.getElementById("dirLinks").classList.add("show");
      };
    } else document.getElementById("dirBtn").style.display = "none";
    setTimeout(() => document.getElementById("overlay").classList.add("show"), 500);
    try { parent.postMessage({ type: "hunt-solved", game: "wordsearch" }, "*"); } catch (e) {}
  }

  document.getElementById("hintBtn").addEventListener("click", () => {
    if (busy || level >= words.length) return;
    const line = findWord(grid, words[level]);
    const [r, c] = line[0];
    const el = tileEls.get(grid[r][c].id);
    el.classList.remove("hint"); void el.offsetWidth; el.classList.add("hint");
  });

  render();
}
</script>
</body>
</html>
