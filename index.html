<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Duel</title>
<!-- Home-screen app: icon, name, and opening full screen -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Puzzle Duel">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#f3f4f6;--ink:#121213;--muted:#5d6067;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#121213;--ink:#f1f1ef;--muted:#a3a5ab;color-scheme:dark}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
iframe{display:block;border:0;width:100%;height:100%}
.msg{font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:32px 20px;max-width:40ch}
.msg p{margin:0 0 12px}
.msg code{font-size:14px;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
<script>
// The Google Apps Script scoreboard. If you ever make a NEW deployment, paste its URL here.
const SCOREBOARD = 'https://script.google.com/macros/s/AKfycbzkAecGl9odla9_Ca5yHT2G484_rICHl0xRkGxzAFe1Dy4WnigMBupOi9q7KDskAb2N3g/exec';

// The key comes from this page's own link (…/puzzle-duel/?k=yourkey), so it never sits in the public repo.
function getKey() {
  const fromUrl = new URLSearchParams(location.search).get('k');
  try {
    if (fromUrl) localStorage.setItem('duel.k', fromUrl);
    return fromUrl || localStorage.getItem('duel.k');
  } catch (e) { return fromUrl; }
}

const key = getKey();
if (!key) {
  document.body.innerHTML = '<div class="msg"><p>Open Puzzle Duel with your private link, the one ending in <code>?k=</code> and your key.</p></div>';
} else {
  const frame = document.createElement('iframe');
  frame.title = 'Puzzle Duel scoreboard';
  frame.src = SCOREBOARD + '?k=' + encodeURIComponent(key);
  document.body.appendChild(frame);

  // Reload if the app sat in the background for a while, so the scores are fresh when you open it.
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) frame.src = frame.src;
  });
}
</script>
</body>
</html>
