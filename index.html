<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Duel</title>
<!-- Home-screen app: icon, name, and opening full screen -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Puzzle Duel">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600&display=swap">
<style>
:root{--bg:#f3f4f6;--ink:#121213;--muted:#5d6067;--surface:#ffffff;--line:#d3d6da;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#121213;--ink:#f1f1ef;--muted:#a3a5ab;--surface:#1c1c1e;--line:#3a3a3c;color-scheme:dark}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column}
iframe{display:block;border:0;width:100%;height:100%}
.msg{font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:32px 20px;max-width:40ch}
.msg p{margin:0 0 12px}
.msg code{font-size:14px;color:var(--muted);word-break:break-all}
/* Hunt layer: only shown after REVEAL_AT */
.tabs{display:none;flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--bg)}
.tabs .seg{display:flex;gap:8px;max-width:620px;margin:0 auto}
.tabs button{flex:1;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px "Libre Franklin","Helvetica Neue",Arial,sans-serif;height:36px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}
.views{flex:1;position:relative;min-height:0}
.views iframe{position:absolute;inset:0}
.views iframe[hidden]{display:none}
body.hunt-on .tabs{display:block}
body.hunt-on.playing .tabs{display:none}
</style>
</head>
<body>
<div class="tabs" id="tabs"><div class="seg" role="tablist">
  <button role="tab" id="tabHunt" aria-selected="true">💕 For Alysson</button>
  <button role="tab" id="tabBoard" aria-selected="false">Scoreboard</button>
</div></div>
<div class="views" id="views"></div>
<script>
// The Google Apps Script scoreboard. If you ever make a NEW deployment, paste its URL here.
const SCOREBOARD = 'https://script.google.com/macros/s/AKfycbzkAecGl9odla9_Ca5yHT2G484_rICHl0xRkGxzAFe1Dy4WnigMBupOi9q7KDskAb2N3g/exec';

// The hunt stays completely hidden until this moment (Mountain Time).
// To test early, open the app link with &hunt=preview added. Add &hunt=reset to clear test progress.
const REVEAL_AT = new Date('2026-11-17T16:15:00-07:00');

const params = new URLSearchParams(location.search);
// The key comes from this page's own link (…/puzzle-duel/?k=yourkey), so it never sits in the public repo.
function getKey() {
  const fromUrl = params.get('k');
  try {
    if (fromUrl) localStorage.setItem('duel.k', fromUrl);
    return fromUrl || localStorage.getItem('duel.k');
  } catch (e) { return fromUrl; }
}
if (params.get('hunt') === 'reset') { try { localStorage.removeItem('hunt-progress'); } catch (e) {} }

const key = getKey();
const views = document.getElementById('views');
if (!key) {
  views.innerHTML = '<div class="msg"><p>Open Puzzle Duel with your private link, the one ending in <code>?k=</code> and your key.</p></div>';
} else {
  let hunt = null;
  const huntDue = () => params.get('hunt') === 'preview' || params.get('hunt') === 'reset' || Date.now() >= REVEAL_AT.getTime();
  const boardSrc = SCOREBOARD + '?k=' + encodeURIComponent(key);
  const frame = document.createElement('iframe');
  frame.title = 'Puzzle Duel scoreboard';
  // While the hunt is up, the scoreboard only loads once she taps its tab, so it isn't running in the background.
  if (!huntDue()) frame.src = boardSrc;
  views.appendChild(frame);
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'hunt-playing') document.body.classList.toggle('playing', !!e.data.on);
  });
  function show(which) {
    const onHunt = which === 'hunt';
    if (!onHunt && !frame.getAttribute('src')) frame.src = boardSrc;
    hunt.hidden = !onHunt; frame.hidden = onHunt;
    document.getElementById('tabHunt').setAttribute('aria-selected', onHunt);
    document.getElementById('tabBoard').setAttribute('aria-selected', !onHunt);
  }
  function revealHunt() {
    if (hunt || !huntDue()) return;
    hunt = document.createElement('iframe');
    hunt.title = 'Alysson\'s Adventure';
    hunt.src = 'hunt/index.html';
    views.appendChild(hunt);
    document.body.classList.add('hunt-on');
    document.getElementById('tabHunt').onclick = () => show('hunt');
    document.getElementById('tabBoard').onclick = () => show('board');
    show('hunt');
  }
  revealHunt();
  // If the app is already open when the time arrives, the hunt appears on its own.
  setInterval(revealHunt, 20 * 1000);

  // Reload if the app sat in the background for a while, so the scores are fresh when you open it.
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    revealHunt();
    if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000 && frame.getAttribute('src')) frame.src = frame.src;
  });
}
</script>
</body>
</html>
